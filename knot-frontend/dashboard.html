<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knot - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="assets/logo.png" alt="Knot Logo">
            </a>
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="#" class="btn btn-outline btn-sm" id="viewPublicPageNav">Public Page</a>
                <button class="btn btn-secondary btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        <header class="dashboard-header">
            <h1 style="font-size: 2rem; font-weight: 700; letter-spacing: -0.03em;">Your Dashboard</h1>
            <p style="color: var(--text-muted); margin-top: 4px;">Manage your Knot profile and links</p>
        </header>

        <div class="dashboard-content">
            
            <aside class="profile-card">
                <div class="profile-avatar">
                    <img src="https://api.dicebear.com/7.x/initials/svg?seed=KN" alt="Profile Avatar" id="profileImage" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h2 id="profileName" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 4px;">Knot User</h2>
                <p id="profileBio" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted);">user@example.com</p>
                
                <div class="stats-bar">
                    <div>
                        <span class="stat-value" id="linksCountStat">0</span>
                        <span class="stat-label">Links</span>
                    </div>
                    <div>
                        <span class="stat-value">0</span>
                        <span class="stat-label">Clicks</span>
                    </div>
                </div>
            </aside>

            <section style="min-width: 0;">
                <header class="card-header">
                    <h2>Your Links</h2>
                    <button class="btn btn-primary btn-sm" id="toggleLinkFormBtn">+ Add Link</button>
                </header>
                
                <div class="link-form-container" id="linkFormContainer">
                    <form id="linkForm">
                        <div class="form-group">
                            <label for="linkTitle">Link Title</label>
                            <input type="text" id="linkTitle" placeholder="e.g., YouTube" required>
                        </div>
                        <div class="form-group">
                            <label for="linkUrl">Link URL</label>
                            <input type="url" id="linkUrl" placeholder="https://..." required>
                        </div>
                        <div class="form-group">
                            <label for="linkIcon">Icon (Emoji)</label>
                            <input type="text" id="linkIcon" value="🔗" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Save Link</button>
                    </form>
                </div>

                <div class="links-list" id="linksList">
                    <!-- Links injected here by dashboard.js -->
                    <div style="padding: 32px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                        Loading links...
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
